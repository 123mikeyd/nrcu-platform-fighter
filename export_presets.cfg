[preset.0]
name="Windows Playtest"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/witcheer/move_manifest.json,assets/turbofit/new_motion_manifest.json,assets/doge_man/attack_timing.json,assets/ggb/electrocution_samples.json,assets/bobo/thrust_slash.json,assets/reactions/*.json,assets/witcheer/witcheer_basic_bounds.json"
exclude_filter="tests/*,tools/*,skills/*,*.blend,*.fbx,*.md,*.log,*.py"
export_path="builds/NRCU.exe"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=false
application/product_name="NRCU Platform Fighter"
application/file_description="NRCU v0.2 unfinished alpha playtest"
application/file_version="0.2.0.0"
application/product_version="0.2.0.0"

